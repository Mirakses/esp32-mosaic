; ESP32-Mosaic — raw CSI streaming node (headless ESP32-S3)
;
; A separate, minimal firmware for any ESP32-S3 board (tested target:
; ESP32-S3-DevKitC-1 clones with the N16R8 module — 16 MB flash, 8 MB octal
; PSRAM). It associates with the home router, pings it to keep a steady
; stream of frames, captures the router's Channel State Information and
; streams the per-subcarrier amplitudes to the gateway over WebSocket as
; type:"csi_raw" envelopes. The gateway serves a live view at /viz.
;
;   cp include/config.example.h include/config.h   # then edit
;   pio run -t upload          # build + flash
;   pio device monitor         # serial log
;
; N8R2 / N4 / other S3 boards: change board_build.flash_size and the memory
; type below, or simply use board = esp32-s3-devkitc-1 without the overrides.

[env:csi-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8: 16 MB QIO flash + 8 MB OPI (octal) PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    links2004/WebSockets@^2.6.1

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial over the native USB port too (the port marked USB on the board)
    -DARDUINO_USB_CDC_ON_BOOT=1
